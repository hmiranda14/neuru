# Copy to .github/workflows/neuru-sentinel.yml. Multi-arch build → GHCR.
name: neuru-sentinel image

on:
  workflow_dispatch:
  push:
    tags: ["sentinel-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: scripts/neuru-sentinel
          file: scripts/neuru-sentinel/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hmiranda14/neuru-sentinel:latest
