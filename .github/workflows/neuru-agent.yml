name: Build & publish neuru-agent

# Publishes ghcr.io/hmiranda14/neuru-agent from scripts/neuru-agent/.
# Triggers: manual, or pushing a tag like `agent-v0.1.0`.
on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'
    paths:
      - 'scripts/neuru-agent/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neuru-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ver=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: scripts/neuru-agent
          file: scripts/neuru-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.ver }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
