# Copy to .github/workflows/neuru-box.yml. Builds the all-in-one NEURU image (context = repo
# root, so the app tree is baked in). Multi-arch → GHCR. Trigger: manual or tag box-v*.
name: neuru-box image

on:
  workflow_dispatch:
  push:
    tags: ["box-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/neuru-box/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hmiranda14/neuru-box:latest
