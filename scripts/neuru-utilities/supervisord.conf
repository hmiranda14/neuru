; NEURU Utilities — supervisord base. Only the control agent starts here; every
; service program is written dynamically by util-agent.py into conf.d/ as NEURU
; enables it (that's how central config works — the agent is the only writer).
[supervisord]
nodaemon=true
logfile=/var/log/neuru-util/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:util-agent]
command=python3 /opt/neuru/util-agent.py
autostart=true
autorestart=true
startretries=9999
stdout_logfile=/var/log/neuru-util/util-agent.log
stderr_logfile=/var/log/neuru-util/util-agent.err

[include]
files = /etc/supervisor/conf.d/*.conf
