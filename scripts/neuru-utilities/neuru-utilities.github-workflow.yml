# Copy to .github/workflows/neuru-utilities.yml in the public repo. Builds the
# multi-arch image (amd64 + arm64 / Raspberry Pi) and pushes to GHCR.
# Trigger: manual (workflow_dispatch) OR a tag `utilities-v*`. Not on push to main.
name: neuru-utilities image

on:
  workflow_dispatch:
  push:
    tags: ["utilities-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: scripts/neuru-utilities
          file: scripts/neuru-utilities/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hmiranda14/neuru-utilities:latest
